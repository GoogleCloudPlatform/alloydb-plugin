dataset_config: !ENV "${EVAL_SUITE_DIR}/evalset.json"
dataset_format: agent-format

orchestrator: agent
model_config: !ENV "${EVAL_SUITE_DIR}/model_config.yaml"
simulated_user_model_config: !ENV "${EVAL_SUITE_DIR}/gemini_3.8_flash_model.yaml"

set_up_script: !ENV "${EVAL_SUITE_DIR}/setup.sh"
tear_down_script: !ENV "${EVAL_SUITE_DIR}/teardown.sh"

# The released EvalBench runs the scenarios of one dataset one after another;
# agent_runners takes effect once EvalBench runs each scenario as its own work
# item.
runners:
  agent_runners: 3

# Default per-scenario budget, checked before each turn. evalset.json sets a
# tighter eval_case_timeout for each scenario.
eval_case_timeout: 120m

scorers:
  # 1. Skill activation
  skills_trajectory:
    enforce_order: false
    allow_extra_skills: true

  # 2. Qualitative & rubric LLM judges
  goal_completion:
    model_config: !ENV "${EVAL_SUITE_DIR}/gemini_3.8_flash_model.yaml"
    include_tool_calls: true
  binary_rubric_scorer:
    model_config: !ENV "${EVAL_SUITE_DIR}/gemini_3.8_flash_model.yaml"
    include_tool_calls: true

  # 3. Efficiency & latency telemetry
  turn_count: {}
  agent_steps: {}
  end_to_end_latency: {}
  tool_call_latency: {}
  token_consumption: {}

reporting:
  csv:
    output_directory: !ENV "${EVAL_RESULTS_DIR:/tmp/alloydb-agent-mode-evals/results}"
  bigquery:
    gcp_project_id: !ENV "${EVAL_REPORTING_PROJECT}"
    dataset_id: !ENV "${EVAL_REPORTING_DATASET:evalbench}"
