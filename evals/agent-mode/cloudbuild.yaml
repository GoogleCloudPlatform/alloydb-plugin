timeout: 7200s

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _EVAL_SERVER_IMAGE: us-central1-docker.pkg.dev/cloud-db-nl2sql/evalbench/eval_server:latest
  _TARGET_REGION: us-central1
  _SHARED_CLUSTER: eval-agent-cluster
  _SHARED_POOL: eval-agent-pool
  _SHARED_DATABASE: postgres
  _FOUNDATION_SUFFIX: -evals
  _SHARED_VPC: agents-vpc
  _SHARED_SUBNET: agents-subnet
  _SHARED_ATTACHMENT: agents-psc-attachment-evals
  _EVAL_REPORTING_PROJECT: cloud-db-nl2sql
  _EVAL_REPORTING_DATASET: evalbench

steps:
  - name: '${_EVAL_SERVER_IMAGE}'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail

        echo "Fetching PR #$_PR_NUMBER metadata from GitHub API..."
        HTTP_STATUS=$(curl -s -o /tmp/pr_data.json -w "%{http_code}" \
          "https://api.github.com/repos/$REPO_FULL_NAME/pulls/$_PR_NUMBER")

        if [ "$$HTTP_STATUS" -ne 200 ]; then
          echo "Error fetching PR data: HTTP $$HTTP_STATUS"
          cat /tmp/pr_data.json
          exit 1
        fi

        PR_TITLE=$(jq -r '.title' /tmp/pr_data.json)

        # Check if execution labels are present using exact matching via jq
        if ! jq -e '.labels | any(.name == "autorelease: pending" or .name == "ci:run-agent-mode-evals")' /tmp/pr_data.json > /dev/null; then
          echo "PR #$_PR_NUMBER does not have 'autorelease: pending' or 'ci:run-agent-mode-evals' label. Skipping execution."
          exit 0
        fi
        echo "Execution label detected. Running CUJ 1-3 evaluations..."

        if [[ "$_HEAD_BRANCH" == release-please-* ]]; then
          if [[ "$$PR_TITLE" =~ release\ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            export RELEASE_VERSION="$${BASH_REMATCH[1]}"
          else
            export RELEASE_VERSION="pr-$_PR_NUMBER-release-unknown"
          fi
        else
          export RELEASE_VERSION="pr-$_PR_NUMBER-agent-mode-evals"
        fi

        # Core EvalBench & GCP environment variables
        export EVAL_SUITE_DIR="/workspace/evals/agent-mode"
        export EVAL_SKILLS_DIR="/workspace/skills"
        export EVAL_RESULTS_DIR="/tmp/alloydb-agent-mode-evals/results"
        export EVAL_GCP_PROJECT_ID="$PROJECT_ID"
        export EVAL_GCP_PROJECT_REGION="$_TARGET_REGION"
        export GOOGLE_CLOUD_PROJECT="$PROJECT_ID"
        export EVAL_REPORTING_PROJECT="$_EVAL_REPORTING_PROJECT"
        export EVAL_REPORTING_DATASET="$_EVAL_REPORTING_DATASET"

        # Shared AlloyDB agent pool & foundation testbed (CUJ 2 & CUJ 3)
        export EVAL_SHARED_CLUSTER="$_SHARED_CLUSTER"
        export EVAL_SHARED_POOL="$_SHARED_POOL"
        export EVAL_SHARED_DATABASE="$_SHARED_DATABASE"
        export EVAL_FOUNDATION_SUFFIX="$_FOUNDATION_SUFFIX"
        export EVAL_SHARED_VPC="$_SHARED_VPC"
        export EVAL_SHARED_SUBNET="$_SHARED_SUBNET"
        export EVAL_SHARED_ATTACHMENT="$_SHARED_ATTACHMENT"

        # PR-namespaced per-run resource names to prevent collisions across concurrent PRs
        export CUJ1_CLUSTER="cuj1-pr${_PR_NUMBER}-cluster"
        export CUJ1_PRIMARY="cuj1-pr${_PR_NUMBER}-primary"
        export CUJ1_POOL="cuj1-pr${_PR_NUMBER}-pool"
        export CUJ1_VPC="cuj1-pr${_PR_NUMBER}-vpc"
        export CUJ1_SUBNET="cuj1-pr${_PR_NUMBER}-subnet"
        export CUJ2_NAME="cuj2-pr${_PR_NUMBER}"
        export CUJ3_NAME="cuj3-pr${_PR_NUMBER}"
        export CUJ3_ENGINE_PREFIX="cuj3_pr${_PR_NUMBER}"

        # Guarantee cloud resource cleanup even if EvalBench exits unexpectedly
        trap 'bash /workspace/evals/agent-mode/teardown.sh' EXIT

        cat /workspace/evals/agent-mode/ci_metadata.yaml >> /workspace/evals/agent-mode/run_config.yaml

        cd /evalbench
        export EVAL_CONFIG="/workspace/evals/agent-mode/run_config.yaml"
        ./evalbench/run.sh

        echo "Verifying CUJ evaluation scores..."
        python3 /workspace/evals/agent-mode/verify_scores.py
