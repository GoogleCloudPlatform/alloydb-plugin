gemini_cli_version: "@google/gemini-cli@latest"
generator: gemini_cli
env:
  GOOGLE_CLOUD_PROJECT: !ENV "${GOOGLE_CLOUD_PROJECT}"
  GOOGLE_CLOUD_LOCATION: "global"
  GOOGLE_CLOUD_REGION: !ENV "${EVAL_GCP_PROJECT_REGION}"
  CLOUDSDK_COMPUTE_REGION: !ENV "${EVAL_GCP_PROJECT_REGION}"
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GEMINI_CLI_TRUST_WORKSPACE: "true"
  GEMINI_MODEL: "gemini-3.8-flash"
  # EvalBench passes its own environment to the agent under test; clear the
  # variables that point at the eval suite so the agent can't find the
  # evalset and its rubrics.
  EVAL_SUITE_DIR: ""
  EVAL_CONFIG: ""
  EVAL_SKILLS_DIR: ""
  OLDPWD: ""

setup:
  skills:
    - action: install
      path: !ENV "${EVAL_SKILLS_DIR:/workspace/skills}/alloydb-agent-mode-quickstart"
